databases:
  - name: ceme-orders
    plan: basic-256mb
    databaseName: ceme
    user: ceme

services:
  - type: web
    name: ceme-checkout
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ceme-orders
          property: connectionString
      - key: DEMO_PAYMENTS
        value: "false"
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MP_TEST_MODE
        value: "false"
      - key: FREE_SHIPPING_FROM
        value: "360"
